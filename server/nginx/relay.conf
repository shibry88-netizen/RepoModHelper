# ---------------------------------------------------------------
# RepoModHelper 中转站（2026-11-01 新增）
# 用途：国内 / 网吧无法使用 VPN 时，把 Thunderstore 的下载经本机转发
# 安全：只放行 Thunderstore 的下载相关路径，其余一律 403，不会变成开放代理
# 说明：本文件被 dl.lucifer.yoga 的 443 server 块 include
# ---------------------------------------------------------------

resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
resolver_timeout 5s;

# 健康检查
location = /relay/healthz {
    default_type text/plain;
    add_header Cache-Control "no-cache" always;
    add_header X-Relay-By "dl.lucifer.yoga" always;
    return 200 "relay ok\n";
}

# ① 下载入口：thunderstore.io/package/download/<ns>/<name>/<ver>/
#    上游会 302 到 ccdn，这里把跳转改写成走本机 /relay/cdn/
location ^~ /relay/ts/ {
    if ($request_uri !~ "^/relay/ts/package/download/") { return 403; }
    limit_except GET HEAD { deny all; }

    set $ts_up thunderstore.io;
    proxy_pass https://$ts_up;
    proxy_ssl_server_name on;
    proxy_ssl_name thunderstore.io;

    proxy_http_version 1.1;
    proxy_set_header Host thunderstore.io;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Accept-Encoding "";

    proxy_connect_timeout 20s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;

    proxy_redirect https://ccdn.thunderstore.io/ /relay/cdn/;
    proxy_redirect http://ccdn.thunderstore.io/  /relay/cdn/;

    rewrite ^/relay/ts/(.*)$ /$1 break;
}

# ② 实体文件：ccdn.thunderstore.io/live/repository/packages/<file>.zip
location ^~ /relay/cdn/ {
    if ($request_uri !~ "^/relay/cdn/live/repository/packages/") { return 403; }
    limit_except GET HEAD { deny all; }

    set $cdn_up ccdn.thunderstore.io;
    proxy_pass https://$cdn_up;
    proxy_ssl_server_name on;
    proxy_ssl_name ccdn.thunderstore.io;

    proxy_http_version 1.1;
    proxy_set_header Host ccdn.thunderstore.io;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Accept-Encoding "";

    proxy_connect_timeout 20s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # 大文件（REPOFidelity 156MB）直接流式转发，不落盘、不缓冲
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_redirect off;

    add_header X-Relay-By "dl.lucifer.yoga" always;

    rewrite ^/relay/cdn/(.*)$ /$1 break;
}
